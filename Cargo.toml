[package]
name = "devopscenter"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Interactive Kubernetes REPL for day-to-day devops work (Rust rewrite)"
license = "MIT"
authors = ["Mariano Jose Abdala <marianoabdala@gmail.com>"]

[[bin]]
name = "devopscenter"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "io-std", "time"] }
futures = "0.3"
kube = { version = "4.2", default-features = false, features = ["client", "config", "rustls-tls", "runtime", "ws"] }
k8s-openapi = { version = "0.28", features = ["v1_33"] }
anyhow = "1"
thiserror = "2"
reedline = "0.51"
comfy-table = "7"
owo-colors = "4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
async-trait = "0.1.92"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
